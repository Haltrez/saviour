    <text x="858" y="153" text-anchor="middle" class="mono" font-size="18" fill="#141210">0.5 SOL → BURN</text>
  </g>

  <!-- headline -->
  <text x="64" y="236" class="hero" font-size="80" fill="#141210" letter-spacing="-2">LET'S</text>
  <rect x="71" y="261" width="252" height="82" rx="8" fill="#141210"/>
