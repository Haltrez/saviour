      .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
    </style>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#141210" fill-opacity=".16"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#F7F5EE"/>
  <rect y="0" width="1200" height="64" fill="#FF4F00"/>
  <rect y="64" width="1200" height="3" fill="#141210"/>
  <text x="64" y="44" class="disp" font-size="30" fill="#141210">Saviour</text>

  <!-- art tile -->
  <rect x="848" y="148" width="312" height="312" rx="28" fill="#141210"/>
  <rect x="840" y="140" width="312" height="312" rx="28" fill="#FF4F00" stroke="#141210" stroke-width="3"/>
  <rect x="840" y="140" width="312" height="312" rx="28" fill="url(#dots)"/>
  <g transform="translate(896 196) scale(3.1) rotate(-6 32 32)" fill="none">
    <circle cx="32" cy="32" r="26" stroke="#141210" stroke-width="14"/>
    <path d="M32 6 A26 26 0 0 1 58 32" stroke="#FF4F00" stroke-width="9"/>
    <path d="M58 32 A26 26 0 0 1 32 58" stroke="#F7F5EE" stroke-width="9"/>
    <path d="M32 58 A26 26 0 0 1 6 32" stroke="#FF4F00" stroke-width="9"/>
