<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Titan+One&amp;family=IBM+Plex+Mono:wght@600&amp;display=swap');
      .hero { font-family: 'Archivo Black', 'Arial Black', sans-serif; }
